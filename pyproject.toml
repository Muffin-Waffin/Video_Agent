version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Muffin-Waffin", email = "soniaditya0505@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.165.0",
    "langchain>=1.5.2",
